<h2>Enquiry</h2>
<form action="/submit-equiry" method="POST">
    <table>
        <tr>
        <td><label for="name">Full Name:</label></td>
        <td><input type="text" id="name" name="user_name" required></td>
        </tr>

        <tr>
        <td><label for="email">Email Address:</label></td>
        <td><input type="email" id="email" name="user_email" required></td>
        </tr>
        
        <tr>
        <td><label for="phone number">Phone Number:</label></td>
        <td><input type="phone" id="phone" name="user_phone"></td>    
        </tr>

        <tr>
        <!--Submit Button-->
        <td><button type="submit">Send Enquiry</button></td>
        </tr>

        <tr>
        <!--Reset Button-->
        <td><button type="reset">Reset</button></td>
        </tr>
    </table>

    <select name="enquiry_type" id="enquiry_type">
        <option value="">Select Enquiry Type</option>
        <option value="product">Product Inquiry</option>
        <option value="order">Order Status</option>
        <option value="feedback">Feedback</option>
        <option value="other">Other</option>

    </select>

</form>

<script src="script.js"></script>
